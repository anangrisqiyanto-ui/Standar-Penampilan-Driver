<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Penampilan Driver</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#10282A;--g:#0F3D3E;--g2:#E3EEEB;--bg:#F4F6F4;--line:#DCE3E0;--mut:#5E7270;--ok:#1E8E5A;--okbg:#E2F4EA;--bad:#C8372D;--badbg:#FBE7E4;--warn:#F26B1D;--warnbg:#FFF0E4}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--g);color:#fff;padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:800;flex:1}
button,select,input{font:inherit}
.btn{background:#fff;color:var(--g);border:0;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer}
.btn.p{background:var(--warn);color:#fff}
main{max-width:1200px;margin:0 auto;padding:16px 20px 40px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters label{display:flex;flex-direction:column;font-size:11.5px;font-weight:600;color:var(--mut);gap:4px}
.filters input,.filters select{padding:9px 10px;border:1.5px solid var(--line);border-radius:9px;background:#fff;min-width:130px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.k{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.k span{font-size:12px;color:var(--mut);font-weight:600}
.k b{display:block;font-size:28px;font-weight:800;margin-top:4px}
.k.bad b{color:var(--bad)} .k.warn b{color:var(--warn)} .k.ok b{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.panel h3{margin:0 0 10px;font-size:14px}
.row{display:grid;grid-template-columns:minmax(120px,38%) 1fr 34px;gap:8px;align-items:center;margin:7px 0;font-size:12.5px}
.trk{height:10px;background:var(--g2);border-radius:9px;overflow:hidden}
.trk i{display:block;height:100%;background:var(--warn)}
.trend{display:flex;align-items:flex-end;gap:4px;height:130px;overflow-x:auto;padding-bottom:2px}
.col{flex:1;min-width:20px;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;text-align:center;font-size:10px;color:var(--mut)}
.col .b{background:var(--g2);border-radius:4px 4px 0 0;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.col .b i{background:var(--bad);display:block}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:700;background:#FAFBFA}
tr.c{cursor:pointer} tr.c:hover{background:#F6FAF8}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700}
.t-ok{background:var(--okbg);color:var(--ok)} .t-warn{background:var(--warnbg);color:#B8470A} .t-bad{background:var(--badbg);color:var(--bad)} .t-mut{background:#EEF1F0;color:var(--mut)}
.rep{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.rep:first-of-type{border-top:0}
.empty{color:var(--mut);padding:18px 0;text-align:center}
#login{position:fixed;inset:0;background:var(--g);display:flex;align-items:center;justify-content:center;z-index:50}
#login div{background:#fff;border-radius:16px;padding:24px;width:min(340px,90vw)}
#login h2{margin:0 0 14px}
#login input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:10px}
#login .btn{width:100%;background:var(--g);color:#fff;padding:12px}
#lerr{color:var(--bad);font-size:13px;min-height:18px;margin-bottom:6px}
dialog{border:0;border-radius:16px;padding:0;width:min(520px,94vw);max-height:92vh}
dialog::backdrop{background:#0008}
.dh{padding:16px 18px;background:var(--g);color:#fff}
.dh b{font-size:16px;display:block}
.db{padding:16px 18px;overflow:auto}
.db label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 5px}
.db select,.db textarea{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:9px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.df{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);justify-content:flex-end}
.df .btn{border:1.5px solid var(--line)} .df .btn.p{border:0}
a{color:var(--g);font-weight:700}
.cv{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}.big{display:flex;gap:14px;align-items:center;margin-bottom:10px}.big>b{font-size:42px;font-weight:800}.big span{font-size:13px;line-height:1.5}.blist{max-height:240px;overflow:auto;margin-top:6px}

</style>
</head>
<body>
<div id="login"><div>
  <h2>Dashboard Driver</h2>
  <input type="password" id="pin" placeholder="PIN admin" onkeydown="if(event.key==='Enter')doLogin()">
  <div id="lerr"></div>
  <button class="btn" onclick="doLogin()">Masuk</button>
</div></div>

<header>
  <h1>Dashboard Penampilan &amp; Kesehatan Driver</h1>
  <span id="upd" style="font-size:12px;opacity:.8"></span>
  <button class="btn" onclick="load()">Muat ulang</button>
  <button class="btn p" onclick="exportCsv()">Unduh CSV</button>
</header>
<main>
  <div class="filters">
    <label>Dari<input type="date" id="f1" onchange="render()"></label>
    <label>Tanggal acuan / sampai<input type="date" id="f2" onchange="render()"></label>
    <label>BU<select id="fbu" onchange="render()"></select></label>
    <label>Site/DC<select id="fsite" onchange="render()"></select></label>
    <label>Tampilkan<select id="fst" onchange="render()">
      <option value="prob">Bermasalah saja</option><option value="todo">Belum ditindak</option><option value="all">Semua data</option></select></label>
    <label>Cari driver<input id="fq" placeholder="Nama / NIK" oninput="render()"></label>
  </div>
  <div class="kpi" id="kpi"></div>
  <div class="panel" id="cov" style="margin-bottom:14px"></div>
  <div class="grid">
    <div class="panel"><h3>Poin yang paling sering tidak sesuai</h3><div id="topItems"></div></div>
    <div class="panel"><h3>Tren harian (merah = bermasalah)</h3><div class="trend" id="trend"></div></div>
    <div class="panel"><h3>Driver berulang bermasalah</h3><div id="repeat"></div></div>
  </div>
  <div class="panel"><h3 id="ttl">Daftar checklist</h3><div class="tw"><table><thead><tr>
    <th>Tanggal</th><th>NIK</th><th>Driver</th><th>BU</th><th>Site/DC</th><th>Kesehatan</th><th>Tdk sesuai</th><th>Status</th><th>Tindak lanjut</th></tr></thead><tbody id="tb"></tbody></table></div></div>
</main>

<dialog id="dlg">
  <div class="dh"><b id="dn"></b><span id="ds" style="font-size:12.5px;opacity:.85"></span></div>
  <div class="db" id="dbody"></div>
  <div class="df"><button class="btn" onclick="dlg.close()">Tutup</button><button class="btn p" onclick="saveAct()">Simpan tindak lanjut</button></div>
</dialog>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzj_2isLYK9oDalqxfxeyiGnrBkxjfFvfQExyW7Y3M7bHI1sVTd3QUFrFs7z7W2kcvoNg/exec';
const $ = id => document.getElementById(id);
const dlg = $('dlg');
let PIN = '', ITEMS = [], ROWS = [], MASTER = [], VIEW = [], cur = null;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cls = s => s === 'Layak' ? 't-ok' : s === 'Perlu Perhatian' ? 't-warn' : 't-bad';
const tgl = r => String(r['Tanggal']).slice(0, 10);
const prob = r => r['Status Kelayakan'] !== 'Layak';
const nik = r => String(r['NIK']).replace(/^'/, '');

function ymd(d){ return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
$('f2').value = ymd(new Date()); $('f1').value = ymd(new Date(Date.now() - 6*864e5));
try { PIN = sessionStorage.getItem('pin') || ''; } catch(e){}
if (PIN) load();

function doLogin(){ PIN = $('pin').value; load(); }
function load(){
  if (SCRIPT_URL.indexOf('GANTI') === 0){ $('lerr').textContent = 'SCRIPT_URL belum dipasang di dashboard.html'; return; }
  $('lerr').textContent = 'Memuat…';
  const cb = 'cb' + Date.now(), s = document.createElement('script');
  let done = false;
  window[cb] = d => { done = true; delete window[cb]; s.remove();
    if (d.error){ $('lerr').textContent = d.error; $('login').style.display = 'flex'; try{sessionStorage.removeItem('pin')}catch(e){} return; }
    try { sessionStorage.setItem('pin', PIN); } catch(e){}
    $('login').style.display = 'none'; ITEMS = d.items; ROWS = d.rows; MASTER = d.master || [];
    $('upd').textContent = 'Diperbarui ' + new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
    fillSel('fbu', 'BU'); fillSel('fsite', 'Site/DC'); render(); };
  s.src = SCRIPT_URL + '?action=list&days=120&pin=' + encodeURIComponent(PIN) + '&callback=' + cb;
  s.onerror = () => { $('lerr').textContent = 'Gagal terhubung ke Apps Script'; s.remove(); };
  setTimeout(() => { if (!done) $('lerr').textContent = $('lerr').textContent === 'Memuat…' ? 'Waktu habis, coba lagi' : $('lerr').textContent; }, 20000);
  document.head.appendChild(s);
}
function fillSel(id, key){
  const el = $(id), keep = el.value;
  const vals = [...new Set(ROWS.map(r => r[key]).concat(MASTER.map(m => key === 'BU' ? m.bu : m.site)).filter(Boolean))].sort();
  el.innerHTML = '<option value="">Semua</option>' + vals.map(v => `<option>${esc(v)}</option>`).join('');
  el.value = keep;
}
function filtered(){
  const a = $('f1').value, b = $('f2').value, bu = $('fbu').value, si = $('fsite').value, q = $('fq').value.toLowerCase();
  return ROWS.filter(r => (!a || tgl(r) >= a) && (!b || tgl(r) <= b) && (!bu || r['BU'] === bu) && (!si || r['Site/DC'] === si)
    && (!q || String(r['Nama Driver']).toLowerCase().includes(q) || nik(r).includes(q)));
}
function render(){
  const base = filtered(), st = $('fst').value;
  const pr = base.filter(prob), todo = pr.filter(r => r['Status Tindak Lanjut'] === 'Belum Ditindak');
  const pct = base.length ? Math.round((base.length - pr.length) / base.length * 100) : 0;
  $('kpi').innerHTML =
    `<div class="k"><span>Total pengisian</span><b>${base.length}</b></div>` +
    `<div class="k ok"><span>Layak bertugas</span><b>${pct}%</b></div>` +
    `<div class="k warn"><span>Bermasalah</span><b>${pr.length}</b></div>` +
    `<div class="k bad"><span>Sakit / tidak layak</span><b>${base.filter(r => r['Status Kelayakan'] === 'Tidak Layak Bertugas').length}</b></div>` +
    `<div class="k bad"><span>Belum ditindak</span><b>${todo.length}</b></div>`;

  renderCov();
  // poin tersering tidak sesuai
  const cnt = ITEMS.map(n => base.filter(r => r[n] === 'Tidak Sesuai').length);
  const mx = Math.max(1, ...cnt);
  const idx = cnt.map((c, i) => i).filter(i => cnt[i] > 0).sort((x, y) => cnt[y] - cnt[x]).slice(0, 6);
  $('topItems').innerHTML = idx.length ? idx.map(i =>
    `<div class="row"><span>${i+1}. ${esc(ITEMS[i])}</span><div class="trk"><i style="width:${cnt[i]/mx*100}%"></i></div><b>${cnt[i]}</b></div>`).join('')
    : '<div class="empty">Tidak ada pelanggaran pada periode ini</div>';

  // tren harian
  const days = {};
  base.forEach(r => { const d = tgl(r); (days[d] = days[d] || {t:0, p:0}).t++; if (prob(r)) days[d].p++; });
  const dk = Object.keys(days).sort(), dm = Math.max(1, ...dk.map(k => days[k].t));
  $('trend').innerHTML = dk.length ? dk.map(k => { const d = days[k];
    return `<div class="col" title="${k}: ${d.p}/${d.t} bermasalah"><div class="b" style="height:${d.t/dm*100}%"><i style="height:${d.p/d.t*100}%"></i></div>${k.slice(8)}</div>`; }).join('')
    : '<div class="empty" style="width:100%">Belum ada data</div>';

  // driver berulang
  const per = {};
  pr.forEach(r => { const k = nik(r); (per[k] = per[k] || {n: r['Nama Driver'], c: 0}).c++; });
  const rp = Object.entries(per).filter(([, v]) => v.c >= 2).sort((a, b) => b[1].c - a[1].c).slice(0, 8);
  $('repeat').innerHTML = rp.length ? rp.map(([k, v]) =>
    `<div class="rep" onclick="$('fq').value='${esc(k)}';$('fst').value='prob';render()"><span><b>${esc(v.n)}</b> <span style="color:var(--mut)">${esc(k)}</span></span><span class="tag t-bad">${v.c}× bermasalah</span></div>`).join('')
    : '<div class="empty">Tidak ada driver yang berulang</div>';

  // tabel
  VIEW = (st === 'all' ? base : st === 'todo' ? todo : pr).slice().sort((a, b) => String(b['Timestamp']).localeCompare(String(a['Timestamp'])));
  $('ttl').textContent = `Daftar checklist (${VIEW.length})`;
  $('tb').innerHTML = VIEW.length ? VIEW.map((r, i) => {
    const tl = r['Status Tindak Lanjut'];
    return `<tr class="c" onclick="openRow(${i})"><td>${tgl(r)}</td><td>${esc(nik(r))}</td><td><b>${esc(r['Nama Driver'])}</b></td><td>${esc(r['BU'])}</td><td>${esc(r['Site/DC'])}</td>` +
      `<td>${esc(r['Kondisi Kesehatan'])}</td><td>${r['Jumlah Tidak Sesuai']}</td><td><span class="tag ${cls(r['Status Kelayakan'])}">${esc(r['Status Kelayakan'])}</span></td>` +
      `<td><span class="tag ${tl === 'Selesai' ? 't-ok' : tl === 'Dalam Proses' ? 't-warn' : tl === 'Belum Ditindak' ? 't-bad' : 't-mut'}">${esc(tl || '-')}</span>${r['Tindakan'] ? ' ' + esc(r['Tindakan']) : ''}</td></tr>`;
  }).join('') : '<tr><td colspan="9" class="empty">Tidak ada data untuk filter ini</td></tr>';
}


function renderCov(){
  const el = $('cov'), day = $('f2').value;
  if (!MASTER.length){ el.innerHTML = '<h3>Kepatuhan pengisian</h3><div class="empty">Master driver belum diisi. Isi sheet "Master Driver" (NIK, Nama Driver, BU, Site/DC, No HP).</div>'; return; }
  const bu = $('fbu').value, si = $('fsite').value;
  const done = new Set(ROWS.filter(r => tgl(r) === day).map(nik));
  const mm = MASTER.filter(m => (!bu || m.bu === bu) && (!si || m.site === si));
  const sudah = mm.filter(m => done.has(m.nik)).length, belum = mm.filter(m => !done.has(m.nik));
  const pct = mm.length ? Math.round(sudah / mm.length * 100) : 0;
  const known = new Set(MASTER.map(m => m.nik)), asing = [...done].filter(n => !known.has(n)).length;
  const sites = {};
  mm.forEach(m => { const k = (m.bu || '-') + ' / ' + (m.site || '-'); const o = sites[k] = sites[k] || {t:0, s:0}; o.t++; if (done.has(m.nik)) o.s++; });
  const wa = m => { let h = m.hp; if (!h) return ''; if (h[0] === '0') h = '62' + h.slice(1);
    return ` <a href="https://wa.me/${h}?text=${encodeURIComponent('Halo ' + m.nama + ', mohon segera isi checklist penampilan driver hari ini.')}" target="_blank" rel="noopener">Ingatkan via WA</a>`; };
  const d = new Date(day + 'T00:00:00').toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  el.innerHTML = `<h3>Kepatuhan pengisian — ${d}</h3><div class="cv"><div>` +
    `<div class="big"><b style="color:${pct >= 95 ? 'var(--ok)' : pct >= 80 ? 'var(--warn)' : 'var(--bad)'}">${pct}%</b><span>${sudah} sudah isi dari ${mm.length} driver<br><b style="color:var(--bad)">${belum.length} belum mengisi</b>` +
    (asing ? `<br><span style="color:var(--mut)">${asing} NIK terkirim tapi tidak ada di master</span>` : '') + `</span></div>` +
    Object.entries(sites).sort((a, b) => a[0].localeCompare(b[0])).map(([k, o]) =>
      `<div class="row"><span>${esc(k)}</span><div class="trk"><i style="width:${o.s / o.t * 100}%;background:var(--ok)"></i></div><b>${o.s}/${o.t}</b></div>`).join('') +
    `</div><div><b style="font-size:13px">Belum mengisi (${belum.length})</b><div class="blist">` +
    (belum.length ? belum.map(m => `<div class="rep" style="cursor:default"><span><b>${esc(m.nama)}</b> <span style="color:var(--mut)">${esc(m.nik)} · ${esc(m.site)}</span></span><span>${wa(m)}</span></div>`).join('')
      : '<div class="empty">Semua driver sudah mengisi 🎉</div>') + `</div></div></div>`;
}

function openRow(i){
  const r = cur = VIEW[i];
  const bad = ITEMS.filter(n => r[n] === 'Tidak Sesuai');
  $('dn').textContent = r['Nama Driver'] + ' · ' + nik(r);
  $('ds').textContent = `${tgl(r)} · ${r['BU']} · ${r['Site/DC']} · ${r['Shift/Aktivitas']}`;
  const opt = (arr, v) => arr.map(x => `<option ${x === v ? 'selected' : ''}>${x}</option>`).join('');
  $('dbody').innerHTML =
    `<span class="tag ${cls(r['Status Kelayakan'])}">${esc(r['Status Kelayakan'])}</span>` +
    `<p><b>Kesehatan:</b> ${esc(r['Kondisi Kesehatan'])}${r['Keluhan'] ? ' — ' + esc(r['Keluhan']) : ''}<br><b>Istirahat:</b> ${esc(r['Istirahat Cukup'])}</p>` +
    `<b>Poin tidak sesuai (${bad.length})</b><div class="chips">${bad.length ? bad.map(n => `<span class="tag t-bad">${esc(n)}</span>`).join('') : '<span class="tag t-ok">Semua sesuai</span>'}</div>` +
    (r['Foto'] ? `<p><a href="${esc(r['Foto'])}" target="_blank" rel="noopener">Lihat foto penampilan</a></p>` : '') +
    `<label>Status tindak lanjut</label><select id="as">${opt(['Belum Ditindak','Dalam Proses','Selesai'], r['Status Tindak Lanjut'])}</select>` +
    `<label>Tindakan</label><select id="at"><option value="">-</option>${opt(['Teguran Lisan','Teguran Tertulis (SP)','Dipulangkan / Istirahat','Pembinaan','Tidak Perlu Tindakan'], r['Tindakan'])}</select>` +
    `<label>Catatan</label><textarea id="ac" rows="3">${esc(r['Catatan Admin'])}</textarea>`;
  dlg.showModal();
}
function saveAct(){
  const body = { action:'update', pin:PIN, id:cur['ID'], status:$('as').value, tindakan:$('at').value, catatan:$('ac').value };
  cur['Status Tindak Lanjut'] = body.status; cur['Tindakan'] = body.tindakan; cur['Catatan Admin'] = body.catatan;
  fetch(SCRIPT_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})
    .then(() => setTimeout(load, 1500)).catch(() => alert('Gagal menyimpan. Cek koneksi.'));
  dlg.close(); render();
}
function exportCsv(){
  if (!VIEW.length) return;
  const cols = Object.keys(VIEW[0]).filter(k => k !== 'Foto' || true);
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const csv = [cols.map(q).join(',')].concat(VIEW.map(r => cols.map(c => q(r[c])).join(','))).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], {type:'text/csv'}));
  a.download = 'checklist-driver-' + ymd(new Date()) + '.csv'; a.click();
}
</script>
</body>
</html>
